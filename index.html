<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Webkiosk • Fælles Kalender (URL-mode)</title>
  <style>
    :root { --bg:#0b0c10; --fg:#e6edf3; --muted:#9aa4ad; --accent:#7dcfff; --card:#111317; --border:#22252b; }
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{max-width:1100px;margin:0 auto;padding:20px}
    header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .badge{font-size:12px;border:1px solid var(--border);padding:4px 8px;border-radius:999px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
    label{display:block;font-weight:600;margin:8px 0 6px}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1115;color:var(--fg)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    button{appearance:none;border:1px solid var(--border);background:#171a20;color:var(--fg);padding:10px 14px;border-radius:12px;cursor:pointer}
    button.primary{border-color:#2b73ff;background:#2b73ff1a}
    .hint{color:var(--muted);font-size:14px;margin-top:6px}
    iframe{width:100%;height:calc(100vh - 260px);border:0;border-radius:16px;background:#0f1115}
    @media (max-width:860px){ .row{grid-template-columns:1fr} iframe{height:calc(100vh - 320px);} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 style="margin:0">Webkiosk</h1>
      <span class="badge" id="hidBadge">HID: —</span>
      <span class="badge">Deler via URL</span>
      <span class="badge">Ingen upload</span>
    </header>

    <div class="card" id="cfg">
      <div class="row">
        <div>
          <label for="hid">Husstand-ID (HID)</label>
          <input id="hid" placeholder="Fx FAMILIE01" />
          <div class="hint">Alle enheder skal bruge <b>samme</b> HID for at dele visningen.</div>
        </div>
        <div>
          <label for="calUrl">Kalender-URL (peg på calendar.html)</label>
          <input id="calUrl" placeholder="https://<brugernavn>.github.io/webkiosk/calendar.html?hid=FAMILIE01&ics=<...>" />
          <div class="hint">Sæt evt. <code>&import=</code> i stedet for <code>&ics=</code>, hvis du bruger et CORS-venligt feed (Apps Script).</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="saveLoad">Gem og indlæs</button>
        <button id="copyLink">Kopiér delingslink</button>
        <button id="reset">Nulstil</button>
      </div>
      <div class="hint" id="status">Klar.</div>
    </div>

    <div style="margin-top:14px">
      <iframe id="view" title="Kalender"></iframe>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const qs = new URLSearchParams(location.search);
    const LS_KEY = "webkiosk:v2";

    function withParam(url, key, value){
      try {
        const u = new URL(url, location.href);
        if (value == null || value === "") {
          u.searchParams.delete(key);
        } else {
          u.searchParams.set(key, value);
        }
        return u.toString();
      } catch(e) {
        return url;
      }
    }

    function loadFromState(state){
      const hid = state.hid || "FAMILIE01";
      const calUrl = state.calUrl || "";

      $("#hid").value = hid;
      $("#calUrl").value = calUrl;
      $("#hidBadge").textContent = "HID: " + hid;

      if (calUrl){
        // Sørg for at kalender-URL’en også får ?hid=
        const target = withParam(calUrl, "hid", hid);
        $("#view").src = target;
        $("#status").textContent = "Indlæser " + target;
      }
    }

    function currentState(){
      return {
        hid: $("#hid").value.trim() || "FAMILIE01",
        calUrl: $("#calUrl").value.trim()
      };
    }

    $("#saveLoad").onclick = () => {
      const st = currentState();
      localStorage.setItem(LS_KEY, JSON.stringify(st));
      loadFromState(st);
    };

    $("#copyLink").onclick = async () => {
      const st = currentState();
      // Delingslink til kiosken selv – med cal + hid indkodet
      let kioskLink = location.origin + location.pathname;
      kioskLink = withParam(kioskLink, "hid", st.hid);
      kioskLink = withParam(kioskLink, "cal", st.calUrl);
      await navigator.clipboard.writeText(kioskLink);
      $("#status").textContent = "Link kopieret til udklipsholder.";
    };

    $("#reset").onclick = () => {
      localStorage.removeItem(LS_KEY);
      location.href = location.origin + location.pathname; // uden query
    };

    // Init: læs rækkefølge → URL > localStorage > defaults
    const fromUrl = {
      hid: qs.get("hid") || undefined,
      calUrl: qs.get("cal") || undefined
    };
    const fromLs = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    loadFromState({hid: fromUrl.hid ?? fromLs.hid ?? "FAMILIE01",
                   calUrl: fromUrl.calUrl ?? fromLs.calUrl ?? ""});

    // Live-opdatér badge når HID ændres
    $("#hid").addEventListener("input", () => {
      $("#hidBadge").textContent = "HID: " + ($("#hid").value || "FAMILIE01");
    });
  </script>
</body>
</html>
