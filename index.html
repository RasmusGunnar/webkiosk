<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FC Nordsjælland Fan Hub · Web preview</title>
    <style>
      :root {
        --accent: #d50032;
        --muted: #e8ecf0;
        --text-primary: #0c1a2b;
        --text-secondary: #3d4a5c;
        --bg: #f6f7fb;
        --overlay: rgba(6, 9, 18, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text-primary);
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .hero {
        position: relative;
        min-height: 260px;
        color: #fff;
        display: grid;
        place-items: end start;
        overflow: hidden;
        border-bottom-left-radius: 24px;
        border-bottom-right-radius: 24px;
        box-shadow: 0 20px 50px rgba(12, 26, 43, 0.15);
        isolation: isolate;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(12, 26, 43, 0.2) 0%, rgba(12, 26, 43, 0.85) 90%),
          url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1400&q=80&sat=-20&blend=111827&sat=-25")
            center/cover no-repeat;
        z-index: -2;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(213, 0, 50, 0.2), transparent 35%);
        z-index: -1;
      }

      .hero-content {
        padding: 28px 20px 18px;
        display: grid;
        gap: 12px;
        width: 100%;
      }

      .hero-logos {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        backdrop-filter: blur(6px);
      }

      .hero-logo {
        height: 44px;
        width: 44px;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 6px;
      }

      .hero-logo-divider {
        width: 1px;
        height: 32px;
        background: rgba(255, 255, 255, 0.25);
      }

      .app-name {
        font-weight: 800;
        font-size: 26px;
        margin: 0;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      .app-tagline {
        margin: 0;
        color: #fbe0e6;
        font-size: 15px;
      }

      .hero-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tab-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px 12px 6px;
        background: linear-gradient(180deg, #fefefe, #f6f7fb);
        border-bottom: 1px solid var(--muted);
        box-shadow: 0 6px 16px rgba(12, 26, 43, 0.05);
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(8px);
      }

      .tab-button {
        border: 1px solid transparent;
        background: var(--muted);
        color: var(--text-secondary);
        padding: 9px 14px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.12s ease;
        box-shadow: inset 0 1px 0 #fff;
      }

      .tab-button.active {
        border-color: var(--accent);
        background: #fff;
        color: var(--accent);
        box-shadow: 0 8px 18px rgba(213, 0, 50, 0.15);
      }

      .content {
        padding: 16px;
        display: grid;
        gap: 12px;
        padding-bottom: 40px;
      }

      .section {
        background: #fff;
        border-radius: 18px;
        padding: 14px 14px 12px;
        box-shadow: 0 12px 40px rgba(12, 26, 43, 0.06);
        border: 1px solid #e3e7ee;
        display: grid;
        gap: 10px;
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title {
        font-size: 16px;
        font-weight: 800;
        margin: 0;
      }

      .divider {
        flex: 1;
        height: 1px;
        background: var(--muted);
      }

      .card {
        border: 1px solid var(--muted);
        background: linear-gradient(180deg, #fff, #f9fbff);
        border-radius: 14px;
        padding: 12px;
        display: grid;
        gap: 10px;
        margin-top: 6px;
        box-shadow: 0 8px 24px rgba(12, 26, 43, 0.05);
      }

      .card-header {
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }

      .card-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }

      .card-subtitle {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .card-meta {
        margin: 2px 0 0;
        font-size: 12px;
        color: #5b6a7e;
        font-weight: 600;
      }

      .card-badge {
        background: var(--accent);
        color: #fff;
        padding: 4px 10px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(213, 0, 50, 0.3);
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        background: #f3f5f9;
        border: 1px solid var(--muted);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--text-secondary);
        font-weight: 700;
        box-shadow: inset 0 1px 0 #fff;
      }

      .caption {
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 18px;
        margin: 0;
        font-weight: 600;
      }

      .stack {
        display: grid;
        gap: 8px;
      }

      .media-card {
        overflow: hidden;
        padding: 0;
      }

      .media { position: relative; overflow: hidden; border-radius: 12px; }

      .media img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        display: block;
      }

      .media::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(12, 26, 43, 0) 0%, rgba(12, 26, 43, 0.4) 100%);
      }

      .media-content {
        position: absolute;
        bottom: 10px;
        left: 12px;
        right: 12px;
        color: #fff;
        display: grid;
        gap: 4px;
        text-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
      }

      .media-title {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
      }

      .media-subtitle {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: #e9edf3;
      }

      .gallery {
        display: grid;
        gap: 10px;
        overflow-x: auto;
        grid-auto-flow: column;
        grid-auto-columns: 240px;
        padding-bottom: 6px;
      }

      .gallery-card {
        position: relative;
        height: 180px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(12, 26, 43, 0.15);
      }

      .gallery-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .gallery-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: flex-end;
        padding: 12px;
        background: linear-gradient(180deg, rgba(12, 26, 43, 0.05), rgba(12, 26, 43, 0.7));
        color: #fff;
        gap: 4px;
      }

      .gallery-title {
        margin: 0;
        font-weight: 800;
        font-size: 15px;
      }

      .gallery-caption {
        margin: 0;
        font-weight: 600;
        font-size: 13px;
        color: #f1f4f9;
      }

      @media (min-width: 960px) {
        .content {
          max-width: 900px;
          margin: 0 auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div class="hero-content">
          <div class="hero-logos" aria-label="Næste kamp logoer">
            <img
              class="hero-logo"
              src="https://upload.wikimedia.org/wikipedia/en/thumb/e/e8/FC_Nordsj%C3%A6lland_logo.svg/1200px-FC_Nordsj%C3%A6lland_logo.svg.png"
              alt="FCN logo"
              loading="lazy"
            />
            <div class="hero-logo-divider" aria-hidden="true"></div>
            <img
              class="hero-logo"
              src="https://upload.wikimedia.org/wikipedia/en/thumb/c/cc/Br%C3%B8ndby_IF_logo.svg/1200px-Br%C3%B8ndby_IF_logo.svg.png"
              alt="Brøndby IF logo"
              loading="lazy"
            />
          </div>
          <h1 class="app-name">FC Nordsjælland Fan Hub</h1>
          <p class="app-tagline">Byfællesskaber · Fraktioner · Kampdag</p>
          <div class="hero-badges" id="heroBadges"></div>
        </div>
      </header>
      <nav class="tab-bar" id="tabBar"></nav>
      <main class="content" id="content" aria-live="polite"></main>
    </div>

    <script type="module">
      const tabs = [
        { key: "home", label: "Hjem" },
        { key: "communities", label: "Byfællesskaber" },
        { key: "factions", label: "Fraktioner" },
        { key: "matchday", label: "Kampdag" },
        { key: "inbox", label: "Indbakke" },
        { key: "profile", label: "Profil" },
      ];

      const heroHighlights = ["Næste kamp · 2. nov", "90+ billeder fra tribunen", "Fællesture · Tifo · Samkørsel"];

      const match = {
        opponent: "Brøndby IF",
        datetime: "Lør 2. nov · 16:00",
        venue: "Right to Dream Park",
        focus: ["Superliga", "Hjemmebane"],
      };

      const communities = [
        {
          name: "Ganløse",
          members: 128,
          heading: "13 tager afsted til næste kamp",
          highlights: ["Samling på torvet 13:30", "2 lift ledige"],
          image: "https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?auto=format&fit=crop&w=800&q=80",
        },
        {
          name: "Farum",
          members: 342,
          heading: "Fælles afgang fra stationen 14:45",
          highlights: ["“Kom alene”-venligt", "3 events i dag"],
          image: "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=800&q=80",
        },
        {
          name: "Hillerød",
          members: 210,
          heading: "Udebanetur til Aarhus planlægges",
          highlights: ["2 samkørsler åbne", "Afstemning om fanmarch"],
          image: "https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=800&q=80",
        },
      ];

      const factions = [
        {
          name: "Wild Tigers",
          members: 512,
          motto: "Sektion C · Høj energi · Tifo & chants",
          channels: ["#kampdag", "#sange", "#tifo"],
          setlist: ["FCN – Vi er her igen", "Nord som aldrig før", "Alle mand på dæk"],
          image: "https://images.unsplash.com/photo-1522778119026-939cd0d94eab?auto=format&fit=crop&w=900&q=80",
        },
        {
          name: "Mild Fathers",
          members: 94,
          motto: "Familietribunen · Rolig stemning · Hyggelige ture",
          channels: ["#kampdag", "#planlægning", "#familie"],
          setlist: ["For Farum og for familien", "Vi står sammen", "Klapsang til pausen"],
          image: "https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=900&q=80",
        },
      ];

      const events = {
        ganlose: [
          {
            title: "Samling i Ganløse før kamp",
            time: "13:30 · Ganløse Torv",
            tags: ["Lokalt", "Velkommen alene"],
            attendees: 18,
          },
          {
            title: "Fælles afgang med bil",
            time: "14:15 · 3 pladser",
            tags: ["Samkørsel"],
            attendees: 6,
          },
          {
            title: "Efterkamp på Farum Kro",
            time: "18:30 · “Vi fejrer sejren”",
            tags: ["Efterkamp"],
            attendees: 12,
          },
        ],
        matchday: [
          {
            title: "Indgang 1 · Fanrute",
            time: "15:20 · March fra stationen",
            tags: ["Stadion", "Offentlig"],
            attendees: 44,
          },
          {
            title: "Wild Tigers · Tifo brief",
            time: "14:45 · Sektion C indgang",
            tags: ["Fraktion", "Read-only info"],
            attendees: 60,
          },
        ],
      };

      const inbox = [
        { title: "Ny fraktion opdatering", detail: "Wild Tigers har pin’et setlisten for Brøndby-kampen." },
        { title: "Lift tilbudt fra Ganløse", detail: "Jacob: 2 pladser, afgang 14:10." },
        { title: "Nyt event", detail: "Efterkamp på Farum Kro er oprettet." },
        { title: "Notifikationer", detail: "Du har nye beskeder i #kampdag (Wild Tigers)." },
      ];

      const gallery = [
        {
          title: "Sektion C i rødt",
          caption: "Tifo klar – flag og røg til opvarmningen",
          image:
            "https://images.unsplash.com/photo-1478146896981-b80fe463b330?auto=format&fit=crop&w=1200&q=80&sat=-15",
        },
        {
          title: "Familietribunen hygger",
          caption: "Kakao, ansigtsmaling og autografer til de yngste",
          image: "https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?auto=format&fit=crop&w=1200&q=80",
        },
        {
          title: "Fanrute fra stationen",
          caption: "Røde halstørklæder hele vejen til Right to Dream",
          image: "https://images.unsplash.com/photo-1434648957308-5e6a859697e8?auto=format&fit=crop&w=1200&q=80",
        },
      ];

      const songs = [
        {
          title: "FCN – Vi er her igen",
          tags: ["Tempo: høj", "Sektion C"],
          body: "Vi er FC Nordsjælland, vi står sammen skulder ved skulder ...",
        },
        {
          title: "For Farum og for familien",
          tags: ["Rolig", "Familietribunen"],
          body: "For Farum, for fællesskabet, vi synger højt for vores hold ...",
        },
      ];

      const featureFlags = {
        songbookEnabled: true,
        factionsPublic: true,
        readOnlyChannels: true,
        remoteConfigDoc: "config/app",
      };

      const contentEl = document.getElementById("content");
      const tabBarEl = document.getElementById("tabBar");
      const heroBadgesEl = document.getElementById("heroBadges");

      const pill = (label) => `<span class="pill">${label}</span>`;

      const pillRow = (items) => `<div class="pill-row">${items.map(pill).join("")}</div>`;

      const card = ({ title, subtitle, meta, highlight, body, image }) => {
        if (image) {
          return `
            <article class="card media-card">
              <div class="media">
                <img src="${image}" alt="${title}" loading="lazy" />
                <div class="media-content">
                  ${highlight ? `<span class="card-badge">${highlight}</span>` : ""}
                  <h3 class="media-title">${title}</h3>
                  ${subtitle ? `<p class="media-subtitle">${subtitle}</p>` : ""}
                  ${meta ? `<p class="card-meta" style="color:#e9edf3">${meta}</p>` : ""}
                </div>
              </div>
              ${body ?? ""}
            </article>
          `;
        }

        return `
          <article class="card">
            <div class="card-header">
              <div style="flex:1">
                <h3 class="card-title">${title}</h3>
                ${subtitle ? `<p class="card-subtitle">${subtitle}</p>` : ""}
                ${meta ? `<p class="card-meta">${meta}</p>` : ""}
              </div>
              ${highlight ? `<span class="card-badge">${highlight}</span>` : ""}
            </div>
            ${body ?? ""}
          </article>
        `;
      };

      const section = (title, body) => `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${title}</h2>
            <div class="divider" aria-hidden="true"></div>
          </div>
          ${body}
        </section>
      `;

      const renderHome = () => {
        const nextMatch = card({
          title: `FCN vs ${match.opponent}`,
          subtitle: match.datetime,
          meta: match.venue,
          body: `
            <div style="display:grid; gap:8px">
              ${pillRow(match.focus)}
              <p class="caption">Tryk “Se kampdag” i appen for events og fanruter.</p>
            </div>
          `,
        });

        const communityCard = card({
          title: "Ganløse",
          subtitle: "Byfællesskab · Offentlig",
          meta: "13 tager afsted · 2 samkørsler",
          highlight: "Fokus",
          image: communities[0].image,
          body: `
            <div style="display:grid; gap:8px">
              ${pillRow(["“Kom alene”-venligt", "Events i dag: 3"])}
              <p class="caption">Brug “Jeg tager afsted” for at tælle op og foreslå samkørsel.</p>
            </div>
          `,
        });

        const activeStack = `
          <div class="stack">
            ${card({ title: "Indgang 1 · Fanrute", subtitle: "15:20 · March fra stationen", meta: "44 kommer" })}
            ${card({ title: "Efterkamp på Farum Kro", subtitle: "18:30", meta: "12 kommer" })}
            ${card({ title: "Wild Tigers #kampdag", subtitle: "Nye beskeder", meta: "Setliste opdateret" })}
          </div>
        `;

        return [
          section("Næste kamp", nextMatch),
          section("Mit fællesskab", communityCard),
          section("Mine aktive ting", activeStack),
        ].join("");
      };

      const renderCommunities = () => {
        const list = communities
          .map((community) =>
            card({
              title: community.name,
              subtitle: `${community.members} medlemmer`,
              meta: community.heading,
              highlight: "Åbent",
              image: community.image,
              body: pillRow(community.highlights),
            }),
          )
          .join("");

        const creator = card({
          title: "By / Område",
          subtitle: "Undgå dubletter · fx “Ganløse (Egedal)”",
          meta: "Offentlig visning · login kræves for at skrive",
          body: pillRow(["Captain + co-captain", "Rapportér/Skjul", "Pinned regler"]),
        });

        return [section("Byfællesskaber (offentlige)", list), section("Opret nyt fællesskab", creator)].join("");
      };

      const renderFactions = () => {
        const list = factions
          .map((faction) =>
            card({
              title: faction.name,
              subtitle: `${faction.members} medlemmer`,
              meta: faction.motto,
              highlight: "Alle kan se",
              image: faction.image,
              body: `
                <div style="display:grid; gap:8px">
                  ${pillRow(faction.channels)}
                  <p class="caption">Sangbog & setlist til kampdag:</p>
                  ${pillRow(faction.setlist)}
                </div>
              `,
            }),
          )
          .join("");

        const songbook = songs
          .map((song) =>
            card({
              title: song.title,
              subtitle: song.tags.join(" · "),
              body: `<p class="caption">${song.body}</p>`,
            }),
          )
          .join("");

        return [section("Fanfraktioner (offentlige)", list), section("Sangbog (offentlig visning)", songbook)].join("");
      };

      const renderMatchday = () => {
        const filters = pillRow(["Før kamp", "Ved stadion", "Efterkamp", "Kun med “Kom alene”"]);

        const ganloseList = events.ganlose
          .map((item) =>
            card({
              title: item.title,
              subtitle: item.time,
              meta: `${item.attendees} kommer`,
              body: pillRow(item.tags),
            }),
          )
          .join("");

        const stadiumList = events.matchday
          .map((item) =>
            card({
              title: item.title,
              subtitle: item.time,
              meta: `${item.attendees} kommer`,
              body: pillRow(item.tags),
            }),
          )
          .join("");

        return [
          section("Filter: Mit fællesskab (Ganløse)", filters),
          section("Events · Ganløse + Offentligt", ganloseList),
          section("Events · Stadion/Fraktion", stadiumList),
        ].join("");
      };

      const renderInbox = () => {
        const inboxCards = inbox
          .map((item) => card({ title: item.title, subtitle: item.detail }))
          .join("");

        const tools = card({
          title: "Read-only kanaler",
          subtitle: "fx #info-fra-capo",
          meta: "Slå til på fraktioner",
          body: pillRow(["Skjul indhold hurtigt", "Rapportér beskeder", "Rate limit (MVP senere)"]),
        });

        return [section("Indbakke", inboxCards), section("Moderator tools", tools)].join("");
      };

      const renderProfile = () => {
        const profileCard = card({
          title: "Bruger",
          subtitle: "Alex, Ganløse · “Kommer ofte alene”",
          meta: "Captain i Ganløse",
          body: pillRow(["Mine fællesskaber: 2", "Mine fraktioner: 1", "Badges: Stemningsskaber"]),
        });

        const flags = card({
          title: "Tænd/sluk uden app update",
          subtitle: `Gemmes i Firestore: ${featureFlags.remoteConfigDoc}`,
          meta: "Bruges til rollout & kill switch",
          body: `
            <div style="display:grid; gap:8px">
              ${pillRow([
                `songbookEnabled: ${featureFlags.songbookEnabled}`,
                `factionsPublic: ${featureFlags.factionsPublic}`,
                `readOnlyChannels: ${featureFlags.readOnlyChannels}`,
              ])}
              <p class="caption">Bruges sammen med EAS Update til små UI-ændringer. Større ting → ny App Store build.</p>
            </div>
          `,
        });

        const release = `
          ${card({
            title: "Hurtige rettelser",
            subtitle: "EAS Update",
            meta: "staging → production",
            body: pillRow(["Bugfix uden App Store", "Tekst/UI-justering"]),
          })}
          ${card({
            title: "Store ændringer",
            subtitle: "Ny version til App Store",
            meta: "Byg med EAS Build",
            body: pillRow(["Store features", "Native SDK"]),
          })}
        `;

        const galleryCards = gallery
          .map(
            (item) => `
              <article class="gallery-card">
                <img src="${item.image}" alt="${item.title}" loading="lazy" />
                <div class="gallery-overlay">
                  <h3 class="gallery-title">${item.title}</h3>
                  <p class="gallery-caption">${item.caption}</p>
                </div>
              </article>
            `,
          )
          .join("");

        const fanMoments = section(
          "Fan moments",
          `<div class="gallery" role="list">${galleryCards}</div>`,
        );

        return [
          section("Profil", profileCard),
          section("Feature flags / konfiguration", flags),
          section("Udgivelsesflow", release),
          fanMoments,
        ].join("");
      };

      const renderers = {
        home: renderHome,
        communities: renderCommunities,
        factions: renderFactions,
        matchday: renderMatchday,
        inbox: renderInbox,
        profile: renderProfile,
      };

      let activeTab = "home";

      const renderTabs = () => {
        tabBarEl.innerHTML = tabs
          .map(
            (tab) => `
              <button class="tab-button ${tab.key === activeTab ? "active" : ""}" data-key="${tab.key}">
                ${tab.label}
              </button>
            `,
          )
          .join("");

        tabBarEl.querySelectorAll("button").forEach((btn) => {
          btn.addEventListener("click", () => {
            activeTab = btn.dataset.key;
            renderTabs();
            renderContent();
          });
        });
      };

      const renderContent = () => {
        const renderer = renderers[activeTab];
        contentEl.innerHTML = renderer ? renderer() : "";
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      heroBadgesEl.innerHTML = heroHighlights.map(pill).join("");
      renderTabs();
      renderContent();
    </script>
  </body>
</html>
